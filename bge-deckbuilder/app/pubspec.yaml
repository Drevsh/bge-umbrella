    - images/mystlings/bolb/cards/
    - images/mystlings/darktailen/cards/
    - images/mystlings/drosithia/cards/
    - images/mystlings/eftus/cards/
    - images/mystlings/emberling/cards/
    - images/mystlings/fale/cards/
    - images/mystlings/flitterspark/cards/
