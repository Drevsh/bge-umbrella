<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>

  <!-- Glowing Branching Network Lines -->
  <path d="M140 320 C 180 260, 220 220, 256 220" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M256 220 C 290 220, 330 180, 370 140" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M256 220 C 300 240, 330 300, 370 340" fill="none" stroke="#f59e0b" stroke-width="12" stroke-dasharray="16 12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Network Nodes -->
  <circle cx="140" cy="320" r="32" fill="#1e293b" stroke="#10b981" stroke-width="10"/>
  <circle cx="140" cy="320" r="14" fill="#10b981"/>

  <circle cx="256" cy="220" r="36" fill="#1e293b" stroke="#6366f1" stroke-width="10"/>
  <circle cx="256" cy="220" r="16" fill="#6366f1"/>

  <circle cx="370" cy="140" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  <circle cx="370" cy="140" r="12" fill="#38bdf8"/>

  <circle cx="370" cy="340" r="32" fill="#1e293b" stroke="#f43f5e" stroke-width="8"/>
  <circle cx="370" cy="340" r="14" fill="#f43f5e"/>

  <!-- Central Scroll / Parchment Emblem -->
  <g transform="translate(196, 160) scale(1.8)">
    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" fill="url(#gold)" opacity="0.9"/>
  </g>
</svg>
